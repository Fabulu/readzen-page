<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Read Zen icon: 禪 (chán) — traditional character, Chinese Chan Buddhism.
       Deliberately no ensō/brush-circle motifs (Japanese Zen aesthetics);
       the character itself, gold on the site's warm dark, is the mark.
       Safe-zone padding keeps the glyph intact under maskable cropping. -->
  <rect width="512" height="512" rx="96" fill="#0b0907"/>
  <rect x="16" y="16" width="480" height="480" rx="84" fill="none" stroke="#d4ab58" stroke-opacity="0.28" stroke-width="6"/>
  <text x="256" y="272"
        font-family="'Noto Serif TC','Songti TC','SimSun',serif"
        font-size="320" fill="#d4ab58"
        text-anchor="middle" dominant-baseline="central">&#x79AA;</text>
</svg>
